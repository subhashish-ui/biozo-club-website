<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIOZO Admin Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 36px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 20px #0001;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 13px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>BIOZO Admin</h1>
    <p>Sign in with an authorised Google account.</p>
    <a href="/auth/google">
      <button type="button">Sign in with Google</button>
    </a>
  </div>
</body>
</html>
